# Phaza Connect relay endpoint on portal.phaza.io.
# Included inside the portal server{} block. Serves ONLY the relay script,
# so it cannot reach the portal application.
location = /phaza-connect {
    include snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME /var/www/phaza-connect/relay.php;
    fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
}
