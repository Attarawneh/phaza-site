*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Outfit',-apple-system,'Segoe UI',sans-serif;color:#f3eefe;background:#07020f;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;background:
 radial-gradient(1100px 560px at 70% -10%, #7c3aed40, transparent 60%),

main{position:relative;text-align:center;padding:32px;max-width:720px;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{height:52px;filter:drop-shadow(0 0 26px #a855f766)}
.net{font-size:13px;letter-spacing:.62em;color:#8b78b8;text-transform:uppercase;margin:14px 0 34px}
h1{font-size:clamp(26px,4.6vw,44px);font-weight:600;line-height:1.25;margin-bottom:18px}
p{color:#c4b5e8;font-size:17px;line-height:1.6;margin-bottom:38px}
.cta{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:12px;font-weight:600;font-size:16px;color:#fff;text-decoration:none;
 background:linear-gradient(120deg,#a855f7,#7c3aed);box-shadow:0 0 28px #a855f74d;transition:transform .16s, box-shadow .16s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 40px #a855f780}
.loc{margin-top:46px;font-size:13px;color:#8b78b8;letter-spacing:.08em}
