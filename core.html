<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Phaza — Intelligence Core (preview)</title>
<style>
  html,body{margin:0;height:100%;background:#04070d;overflow:hidden;
    font-family:'JetBrains Mono',ui-monospace,monospace;color:rgba(255,255,255,.5)}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;left:22px;bottom:20px;font-size:10px;letter-spacing:.06em;line-height:1.9;z-index:2}
  .hud b{color:#5CCBF5;font-weight:500}
  .ttl{position:fixed;left:22px;top:20px;font-size:10px;letter-spacing:.18em;color:#5CCBF5;z-index:2}
  .keys{position:fixed;right:22px;bottom:20px;font-size:10px;letter-spacing:.06em;text-align:right;line-height:1.9;z-index:2}
  .bar{position:fixed;left:22px;bottom:52px;width:220px;height:2px;background:rgba(255,255,255,.12);z-index:2}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00F0FF,#8A2BE2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ttl">PHAZA · INTELLIGENCE CORE · PREVIEW</div>
<div class="hud" id="hud"></div>
<div class="bar"><i id="bar"></i></div>
<div class="keys">
  1 · 2 · 3 &nbsp;density<br>
  [ &nbsp;·&nbsp; ] &nbsp;formation &nbsp;·&nbsp; A &nbsp;auto<br>
  , &nbsp;·&nbsp; . &nbsp;maturity<br>
  R &nbsp;rings on / off &nbsp;·&nbsp; S &nbsp;shell
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();

/* ── the signature ramp, sampled into sprites so a gradient can live inside
      every pixel without building one per particle per frame ───────────── */
const RAMP=[[0,240,255],[0,205,255],[33,160,255],[105,108,255],[138,43,226]];
const at=t=>{t=t<0?0:t>1?1:t;const q=t*4,i=Math.min(3,q|0),f=q-i,a=RAMP[i],b=RAMP[i+1];
  return`rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`};
const rgbc=t=>{t=t<0?0:t>1?1:t;const q=t*4,i=Math.min(3,q|0),f=q-i,a=RAMP[i],b=RAMP[i+1];
  return[a[0]+(b[0]-a[0])*f|0,a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0]};
/* a glow, not a dot: solid core falling to nothing, drawn additively so
   overlapping points build light instead of stacking edges */
const mk=(t,boost)=>{const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d'),[r,g2,b]=rgbc(t),
    hi=v=>Math.min(255,v+boost),
    rg=x.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,`rgba(${hi(r)},${hi(g2)},${hi(b)},1)`);
  rg.addColorStop(.22,`rgba(${r},${g2},${b},.66)`);
  rg.addColorStop(.55,`rgba(${r},${g2},${b},.18)`);
  rg.addColorStop(1,`rgba(${r},${g2},${b},0)`);
  x.fillStyle=rg;x.fillRect(0,0,64,64);return c};
const mkf=t=>{const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d'),[r,g2,b]=rgbc(t),
    w=v=>Math.round(v+(255-v)*.5),                 // washed halfway to white
    rg=x.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,`rgba(${w(r)},${w(g2)},${w(b)},.5)`);
  rg.addColorStop(.30,`rgba(${r},${g2},${b},.28)`);
  rg.addColorStop(.64,`rgba(${r},${g2},${b},.10)`);
  rg.addColorStop(1,`rgba(${r},${g2},${b},0)`);
  x.fillStyle=rg;x.fillRect(0,0,64,64);return c};
const SP=[],HI=[],FD=[];for(let i=0;i<16;i++){SP.push(mk(i/15,0));HI.push(mk(i/15,110));FD.push(mkf(i/15))}

/* ── population: a soft outer shell, three rings that cross it, an inner
      core shell. Rings get the largest share so they read as structure. ── */
let COUNT=2600, RINGS=true, SHELL=true, P=[], SX,SY,SA,SB,SS,SD,SG,SF;
function build(){
  P=[];
  for(let i=0;i<COUNT;i++){
    const r=Math.random();
    // 0 outer shell · 1,2,3 the three rings · 4 inner shell
    const role = r<.30?0 : r<.46?1 : r<.62?2 : r<.78?3 : 4;
    /* Every point has a seat on a ring, whether or not it starts there.
       The sphere is not scenery to be thrown away — it IS the ring, before
       the ring exists. */
    P.push({role,link:-1,linkAll:-1,
      ring: role>=1&&role<=3 ? role : 1+(i%3),
      strand: role>=1&&role<=3 ? i%3 : ((i/3)|0)%3,
      phi:Math.acos(1-2*Math.random()),
      th:Math.random()*Math.PI*2,
      band:(Math.random()-.5),          // where it sits across a ring's width
      band2:(Math.random()-.5),         // and how far it stands off its plane
      seed:Math.random(),
      sz:.5+Math.random()*.75});
  }
  /* Each ring spins as one piece, so the order of its particles around the
     circle never changes — the neighbour can be found once and kept. Joining
     each to the next is what turns a necklace of beads into a drawn circle. */
  /* Two neighbour tables. The first is the ring's own points, which is what
     closes the circles while the sphere is still out there. The second is
     everyone, which is what closes them once the sphere has been drawn in.
     Crossfading between the two keeps the arcs unbroken the whole way. */
  const table=(key,field)=>{
    for(let r=1;r<=3;r++) for(let st=0;st<3;st++){
      const ix=[];
      for(let i=0;i<P.length;i++) if(key(P[i])===r&&P[i].strand===st) ix.push(i);
      ix.sort((a,b)=>P[a].th-P[b].th);
      for(let j=0;j<ix.length;j++) P[ix[j]][field]=ix[(j+1)%ix.length];
    }
  };
  table(p=>p.role>=1&&p.role<=3?p.role:0,'link');
  table(p=>p.ring,'linkAll');
  SX=new Float32Array(COUNT);SY=new Float32Array(COUNT);SA=new Float32Array(COUNT);SB=new Int8Array(COUNT);
  SS=new Float32Array(COUNT);SD=new Float32Array(COUNT);SG=new Float32Array(COUNT);SF=new Int8Array(COUNT);
}
build();

/* Formation: 0 is loose drifting dust, 1 is the finished hologram. Scrolling
   the page walks this from one to the other; here it is on [ and ]. */
let FORM=1, AUTO=false;

/* Maturity: 0 is the sphere with rings crossing it, 1 is no sphere at all —
   every point drawn into the rings, the rings folded onto one plane, one
   circle of glow. Tokens at one end, knowledge at the other. */
let DIST=0;

/* the three strands of a ring: offset across it and off its plane */
const RSTR=[-.55,0,.55], NSTR=[.42,-.5,.36];
const SPIN=[0,.30,-.235,.185], TILT=[0,0,1.05,-.92], ROLL=[0,0,.34,-.5];

const RAD=()=>Math.min(W,H)*0.29;

function frame(now){
  const k=now/1000;
  g.clearRect(0,0,W,H);

  /* aura */
  const av=1-DIST*.85;                             // the body glow goes with the sphere
  const A=RAD()*2.4, ag=g.createRadialGradient(W/2,H/2,0,W/2,H/2,A);
  ag.addColorStop(0,`rgba(0,240,255,${.10*av})`);
  ag.addColorStop(.5,`rgba(105,108,255,${.055*av})`);
  ag.addColorStop(1,'rgba(138,43,226,0)');
  g.fillStyle=ag;g.fillRect(0,0,W,H);

  const R0=RAD()*(1+.022*Math.sin(k*.5))*(1-DIST*.33);  // breathes, and draws in as it matures
  // the camera settles square-on as it matures: a ring in perspective
  // becomes a circle drawn flat
  /* Matured, the drift stops accumulating and becomes a gentle sway, so the
     circle settles square-on and stays there instead of slowly turning back
     into an ellipse. */
  const mt=DIST;
  const tiltX=(.42+.05*Math.sin(k*.23))*(1-mt) + .07*Math.sin(k*.19)*mt,
        tiltY=(k*.07)*(1-mt)               + .10*Math.sin(k*.13)*mt;
  const cx=Math.cos(tiltY),sx=Math.sin(tiltY),cy=Math.cos(tiltX),sy=Math.sin(tiltX);
  const wave=(k*.16)%1;                            // energy front travelling round

  if(AUTO) FORM=(Math.sin(k*.16)*.5+.5);
  const fm=FORM, loose=1-fm, ds=DIST;

  const out=[];
  for(let i=0;i<P.length;i++){
    const p=P[i];
    SA[i]=0;
    if(p.role===0&&!SHELL) continue;
    if(p.role>0&&p.role<4&&!RINGS) continue;

    /* This point's seat on its ring. As maturity rises the three rings give
       up their own tilt, roll and speed and fold onto one plane turning as one
       — three circles becoming a single circle of glow. */
    const rg=p.ring,
          spin=SPIN[rg]+(.30-SPIN[rg])*ds,
          tilt=TILT[rg]*(1-ds)+1.5708*ds,   // folds up into the screen plane
          roll=ROLL[rg]*(1-ds),
          rrr=R0+(rg-2)*R0*.045*ds,
          th2=p.th+k*spin,
          /* A ring is three strands, not a cloud. Loose, each point sits
             anywhere in a wide off-plane haze; formed, it settles onto its own
             exact circle — so the band is thick and smooth rather than ragged,
             and an edge-on ring stays three arcs instead of one hard bar. */
          tight=1+ds*.15,
          w  =RSTR[p.strand]*R0*.055*tight*fm + p.band *R0*.42*loose,
          off=NSTR[p.strand]*R0*.055*tight*fm + p.band2*R0*.40*loose,
          px=(rrr+w)*Math.cos(th2), py=off, pz=(rrr+w)*Math.sin(th2),
          sy1=py*Math.cos(tilt)-pz*Math.sin(tilt), sz1=py*Math.sin(tilt)+pz*Math.cos(tilt),
          seatX=px*Math.cos(roll)-sy1*Math.sin(roll),
          seatY=px*Math.sin(roll)+sy1*Math.cos(roll),
          seatZ=sz1;

    let x,y,z;
    if(p.role===0||p.role===4){
      // the sphere we started from, drawn into its ring as the engine matures
      const rr = p.role===0 ? R0*(1+loose*(p.seed-.5)*.85)
                            : R0*.5*(1+loose*p.band*1.2);
      const th = p.role===0 ? p.th+k*.10 : p.th-k*.17;
      const ax=rr*Math.sin(p.phi)*Math.cos(th), ay=rr*Math.cos(p.phi), az=rr*Math.sin(p.phi)*Math.sin(th);
      x=ax+(seatX-ax)*ds; y=ay+(seatY-ay)*ds; z=az+(seatZ-az)*ds;
    } else { x=seatX; y=seatY; z=seatZ }

    // camera
    const rx=x*cx-z*sx, rz0=z*cx+x*sx;
    const ry=y*cy-rz0*sy, rz=rz0*cy+y*sy;
    const per=520/(520+rz); if(per<=0) continue;
    const sxp=W/2+rx*per, syp=H/2+ry*per;

    /* Where this point sits in the ramp. Depth angle while there is a sphere
       to have depth; once the form is flat, atan2 has nothing left to read, so
       it hands over to the point's own angle around the ring — which is what
       makes the gradient travel round the circle instead of splitting it in
       two. Blended on the shortest path so the ramp does not spin on the way. */
    const angS=(Math.atan2(z,x)/6.2832+1)%1, angR=((th2/6.2832)%1+1)%1;
    let dA=angR-angS; dA-=Math.round(dA);
    const ang=(angS+dA*ds+1)%1;
    const dw=Math.abs(((ang-wave+1.5)%1)-.5);
    const en=Math.max(0,1-dw*7)*(1-ds*.55);          // travelling front, restrained once faded
    const depth=(rz+R0)/(2*R0);                      // 0 front · 1 back
    const flick=.62+.38*Math.sin(k*.9+p.seed*21);    // assemble / fade / reconnect

    // arriving points take on the ring's own weight as they join it
    const a0=p.role===0?.20:p.role===4?.30:.52, s0=p.role===0?4.2:p.role===4?3.6:4.6;
    let a=(a0+(.52-a0)*ds)*flick*(1-depth*.6)*(1+en*1.15)*(.55+.45*fm)*(1-ds*.30);
    let s=p.sz*per*(s0+(4.6-s0)*ds)*(1+en*.55)*(1+ds*1.05);
    const fade=p.seed<ds;
    SX[i]=sxp;SY[i]=syp;SA[i]=a;SS[i]=s;SD[i]=depth;SG[i]=ang;SF[i]=fade?1:0;
    out.push({sxp,syp,s,a,ang,en,depth,fade});
  }

  /* Closing the circles. Not a wire between beads — the gap is packed with
     more of the same glow, so neighbouring points melt into one continuous
     luminous arc. They fill in over the second half of the formation: the
     dots find each other, then the ring becomes solid light. */
  const join=Math.max(0,(fm-.28)/.72);
  if(join>.01){
    // A gap is only closed between points genuinely adjacent on screen;
    // anything longer is a chord across the middle, not an arc.
    const near=R0*.155, near2=near*near;
    const pass=(field,weight)=>{
    if(weight<=.005) return;
    for(let i=0;i<P.length;i++){
      const j=P[i][field];
      if(j<0||SA[i]<=0||SA[j]<=0) continue;
      const dx=SX[j]-SX[i], dy=SY[j]-SY[i], d2=dx*dx+dy*dy;
      if(d2>near2) continue;
      const d=Math.sqrt(d2), sz=(SS[i]+SS[j])*.5;
      const n=Math.max(1,Math.min(5,Math.round(d/(sz*.75))));
      const a=Math.min(SA[i],SA[j])*join*.62*weight, dp=(SD[i]+SD[j])*.5;
      for(let q=1;q<=n;q++){
        const t=q/(n+1);
        out.push({sxp:SX[i]+dx*t, syp:SY[i]+dy*t, s:sz*.92, a, ang:SG[i], en:0, depth:dp, fade:!!SF[i]});
      }
    }};
    pass('link',1-ds); pass('linkAll',ds);
  }

  out.sort((m,n)=>n.depth-m.depth);                  // far pixels first
  g.globalCompositeOperation='lighter';               // light adds up

  for(const o of out){
    g.globalAlpha=Math.min(1,o.a);
    const idx=((o.ang+.5+k*.055)%1*16|0)%16;         // ramp travels with the form
    const img=o.en>.5?HI[idx]:o.fade?FD[idx]:SP[idx];
    g.drawImage(img,o.sxp-o.s,o.syp-o.s,o.s*2,o.s*2);
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  document.getElementById('bar').style.width=(fm*100).toFixed(1)+'%';

  document.getElementById('hud').innerHTML=
    `<b>${out.length}</b> points &nbsp;·&nbsp; formation <b>${(fm*100)|0}%</b> &nbsp;·&nbsp; maturity <b>${(ds*100)|0}%</b> &nbsp;·&nbsp; shell ${SHELL?'on':'off'} &nbsp;·&nbsp; rings ${RINGS?'on':'off'}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('keydown',e=>{
  const K=e.key.toLowerCase();
  if(K==='1'){COUNT=1500;build()} if(K==='2'){COUNT=2600;build()} if(K==='3'){COUNT=4200;build()}
  if(K==='r')RINGS=!RINGS; if(K==='s')SHELL=!SHELL;
  if(K==='[')FORM=Math.max(0,FORM-.1); if(K===']')FORM=Math.min(1,FORM+.1);
  if(K===',')DIST=Math.max(0,DIST-.1); if(K==='.')DIST=Math.min(1,DIST+.1);
  if(K==='a')AUTO=!AUTO;
});
</script>
</body>
</html>
